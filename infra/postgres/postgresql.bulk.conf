# Nizam-e-Qanoon -- bulk-load profile (Document 09a §4.1)
#
# Use this ONLY while a full corpus ingest is running, then switch back to
# postgresql.dev.conf. Every line here trades durability or concurrency for
# throughput, and none of it is safe to leave on.
#
#   docker compose stop postgres
#   # point config_file at this file in compose.yaml, or:
#   docker compose run --rm postgres postgres -c config_file=/etc/postgresql/postgresql.bulk.conf
#
# The order that matters more than any setting here: load the data first, build
# the HNSW and BM25 indexes LAST. Building indexes before the load is the most
# common way to turn a 45-minute index build into a six-hour one.

listen_addresses = '*'
max_connections  = 50

# --- memory ------------------------------------------------------------------
# 09a §4.1 specifies 8GB shared_buffers on the rented build machine. This laptop
# has 15.4 GB total and 09a §3.1 budgets ~10.4 GB to the whole backend, so 6GB
# is the local ceiling. The rented build box uses the full 8GB.
shared_buffers       = 6GB
effective_cache_size = 10GB
work_mem             = 64MB
maintenance_work_mem = 4GB    # 8GB on the rented build machine, during HNSW build

# --- parallelism -------------------------------------------------------------
max_worker_processes             = 16
max_parallel_workers             = 6
max_parallel_workers_per_gather  = 4
max_parallel_maintenance_workers = 4

# --- storage -----------------------------------------------------------------
random_page_cost         = 1.1
effective_io_concurrency = 200

# --- durability traded for throughput ----------------------------------------
# synchronous_commit=off risks losing the last few transactions on a crash. That
# is acceptable here and nowhere else: the ingest is resumable by design (09a §6
# -- every stage writes its state to the database), so a crash costs minutes.
synchronous_commit = off
max_wal_size       = 16GB
min_wal_size       = 2GB
wal_buffers        = 64MB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

jit = off

shared_preload_libraries = 'pg_search,pg_stat_statements'

# --- autovacuum --------------------------------------------------------------
# 09a §4.1 turns autovacuum off on the four large tables only -- NOT globally,
# which would let the small operational tables bloat through a multi-hour load.
# Do it per-table in the migration or by hand, and re-enable plus ANALYZE after:
#
#   ALTER TABLE chunk           SET (autovacuum_enabled = off);
#   ALTER TABLE provision_version SET (autovacuum_enabled = off);
#   ALTER TABLE judgment_paragraph SET (autovacuum_enabled = off);
#   ALTER TABLE source_observation SET (autovacuum_enabled = off);
#   -- after the load:
#   ALTER TABLE ... SET (autovacuum_enabled = on);
#   VACUUM ANALYZE;
autovacuum = on

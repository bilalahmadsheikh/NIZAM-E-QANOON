# Nizam-e-Qanoon -- developer profile
# Derived from Document 09a §4 for this machine: 15.4 GB RAM, 6 physical cores,
# NVMe, ~3 GB budgeted to Postgres out of the 10.4 GB backend total in 09a §3.1.
#
# Default Postgres is tuned for a shared server from a decade ago and will make
# every latency number in 09a wrong. These values are computed from the profile,
# not copied from a blog post.

listen_addresses = '*'
max_connections  = 100

# --- memory ------------------------------------------------------------------
# Sized to the working set, not to a share of host RAM. The statutory index hot
# set is ~400 MB; sizing to 25% of host RAM is an OLTP rule that does not fit a
# small hot index over a large cold corpus.
shared_buffers = 2GB

# Planner hint about what the OS is likely caching. Not an allocation.
effective_cache_size = 8GB

# Per sort/hash node, per parallel worker: 64MB x 4 x 8 conns = 2GB worst case.
work_mem = 64MB

# Only matters on the build job; a developer machine restores indexes rather
# than building them.
maintenance_work_mem = 1GB

# --- parallelism -------------------------------------------------------------
max_worker_processes             = 16
max_parallel_workers             = 6   # = physical cores on this machine
max_parallel_workers_per_gather  = 4
max_parallel_maintenance_workers = 4   # parallel HNSW build: the single biggest
                                       # win on index build time

# --- storage -----------------------------------------------------------------
# NVMe. Leaving random_page_cost at 4.0 makes the planner avoid index scans it
# should be using.
random_page_cost         = 1.1
effective_io_concurrency = 200

# --- write-ahead log ---------------------------------------------------------
wal_buffers                   = 64MB
max_wal_size                  = 2GB   # normal operation; the bulk profile raises this
min_wal_size                  = 512MB
checkpoint_timeout            = 15min
checkpoint_completion_target  = 0.9

# --- planner -----------------------------------------------------------------
jit = off        # hurts more than it helps on our query shapes

# --- extensions --------------------------------------------------------------
# pg_search is required in shared_preload_libraries only below PG 17; harmless
# on 17. pg_stat_statements is what makes a slow retrieval traceable.
shared_preload_libraries = 'pg_search,pg_stat_statements'
pg_stat_statements.max   = 5000
pg_stat_statements.track = top

# hnsw.ef_search is deliberately NOT set here. It is a session-level knob owned
# by the retrieval layer (raise for recall, lower for latency). Cluster-wide
# changes need ALTER SYSTEM + pg_reload_conf(), not ALTER ROLE.

# --- observability -----------------------------------------------------------
# Retrieval traces are what make a bad answer debuggable (09a §2).
log_min_duration_statement = 250ms
log_checkpoints            = on
log_autovacuum_min_duration = 1000ms
track_io_timing            = on

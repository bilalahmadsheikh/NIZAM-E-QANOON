[project]
name = "nizam"
version = "0.1.0"
description = "Nizam-e-Qanoon — Pakistan's intelligent legal infrastructure"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26",     # L1 lane E2: layout-aware extraction with coordinates
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nizam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "import-linter>=2.14",
    "pytest>=9.1.1",
]
